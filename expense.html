
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Personal Expense Tracker</h1>

            <ul class="navigation">
             <li><a href="#">Home</a></li>
             <li><a href="#">Add Expense</a></li>
             <li><a href="#">Expense History</a></li>
             <li><a herf="#">About</a></li>
             <li><a href="#">Contact</a></li>
            </ul>
    </header>
        
<main>
    <h3>Keep track of your daily expenses.</h3>

    <form id="expense-form">

        <label for="expenseName">Expense Name:</label>
        <input type="text" id="expenseName" required>
        <br><br>

        <label for="expenseAmount">Amount:</label>
        <input type="number" id="expenseAmount" min="0.00" step="0.01" required>
        <br><br>

        <label for="expenseDate">Date:</label>
        <input type="date" id="expenseDate" required>
        <br><br>

        <label for="expenseCategory">Category:</label>
        <select id="expenseCategory">
            <option value=" "></option> 
            <option value="Grocery">Grocery</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Transportation">Transportation</option>
            <option value="Other">Other</option>
        </select>

        <button type="submit">Add Expense</button>

    </form>

    <h2>Expense List</h2>
    <ol id="expenseList"></ol>

    </main>

    <footer>
        <p>&copy; 2026/27 My Expense Tracker  BM</p>
    </footer>
    

<script>
    
    const expenses = [];

    // for expenses to be added to list
    document.getElementById("expense-form").addEventListener("submit", function(event) {
        event.preventDefault();

        // get expense info
        const name = document.getElementById("expenseName").value;
        const amount = document.getElementById("expenseAmount").value;
        const date = document.getElementById("expenseDate").value;
        const category = document.getElementById("expenseCategory").value;

        // add expense to list
        expenses.push({
            name: name,
            amount: amount,
            date: date,
            category: category,
            //payment: payment
        });
        
    // display expenses
    const list = document.getElementById("expenseList");
    list.innerHTML = "";
    expenses.forEach(expense => {
        const item = document.createElement("li");
        item.innerHTML = expense.name + " - $" + expense.amount + " - " + expense.date + " - " + expense.category ;
        list.appendChild(item);
    
        });
    });
</script>


</body>

</html>
